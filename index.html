<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Calendários - SENAI</title>
    <!-- Bibliotecas de Estilo e Excel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .day-header { font-size: 0.65rem; font-weight: bold; text-align: center; padding: 2px 0; color: #64748b; }
        .day-cell { 
            aspect-ratio: 1; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; 
            border-radius: 4px; border: 1px solid #e2e8f0; position: relative; overflow: hidden; cursor: default;
        }
        /* Cores Feriado vs Férias */
        .day-cell.holiday { color: #ef4444; font-weight: bold; background-color: #fee2e2; border-color: #fca5a5; }
        .day-cell.ferias { color: #d97706; font-weight: bold; background-color: #fef3c7; border-color: #fde68a; }
        
        .day-cell.weekend { background-color: #f8fafc; color: #94a3b8; }
        .day-cell.has-class { font-weight: bold; color: #1e293b; border-color: rgba(0,0,0,0.1); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .day-number { z-index: 10; text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 1px rgba(255,255,255,1); }
        
        .calendar-scroll::-webkit-scrollbar { width: 8px; }
        .calendar-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .calendar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .calendar-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Ajuste do input de cor */
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 relative">

    <div class="max-w-[1400px] mx-auto p-4 md:p-6 h-screen flex flex-col">
        
        <!-- CABEÇALHO -->
        <header class="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo SENAI" class="h-8 md:h-10 object-contain" onerror="this.style.display='none'">
                <div class="w-px h-10 bg-slate-300 hidden sm:block"></div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-800 leading-tight">Criador de Calendários</h1>
            </div>
            
            <div class="flex flex-wrap gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200">
                <button onclick="newDocument()" class="flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-white hover:shadow-sm rounded transition-all" title="Começar do zero">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Novo
                </button>
                
                <div class="w-px bg-slate-200 my-1 mx-2"></div>
                
                <input type="file" id="file-upload" class="hidden" accept=".xlsx" onchange="importExcel(event)">
                <button onclick="document.getElementById('file-upload').click()" class="flex items-center gap-1.5 px-4 py-2 text-sm font-bold text-blue-700 hover:bg-white hover:shadow-sm rounded transition-all" title="Abrir um arquivo XLSX do seu computador">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Abrir Excel
                </button>
                
                <button onclick="exportExcel()" class="flex items-center gap-1.5 px-4 py-2 text-sm font-bold text-emerald-700 hover:bg-white hover:shadow-sm rounded transition-all" title="Salvar o seu progresso em um arquivo XLSX">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Salvar Excel
                </button>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0">
            
            <!-- PAINEL LATERAL -->
            <div class="w-full lg:w-1/3 flex flex-col gap-4 overflow-y-auto pr-2 pb-4 calendar-scroll">
                
                <!-- Identificação e Capacidade -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="font-bold text-lg mb-4 flex items-center gap-2 text-slate-800">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        Identificação do Curso
                    </h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nome do Curso</label>
                                <input type="text" id="course-name" placeholder="Ex: Eletrotécnica" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Carga Prevista (h)</label>
                                <input type="number" id="course-target-hours" placeholder="Ex: 1200" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                        </div>
                        <div class="border-t border-slate-100 pt-3">
                            <h3 class="text-[11px] font-bold text-slate-500 uppercase mb-2">Capacidade Diária do Curso</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Manhã (Horas)</label>
                                    <input type="number" id="max-morning" value="4" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tarde (Horas)</label>
                                    <input type="number" id="max-afternoon" value="4" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Instrutores -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        Instrutores
                    </h2>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="instructor-name" placeholder="Nome do Instrutor" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm">
                        <button onclick="addInstructor()" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-purple-700 transition-colors">Adicionar</button>
                    </div>
                    <div id="instructors-list" class="flex flex-wrap gap-2 max-h-24 overflow-y-auto calendar-scroll"></div>
                </div>

                <!-- Férias e Feriados -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Férias e Feriados
                    </h2>
                    <div class="flex flex-col gap-2 mb-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <div class="flex gap-2">
                            <select id="holiday-type" class="w-1/3 border border-slate-300 rounded-lg p-2 text-xs font-semibold bg-white text-slate-700 focus:ring-red-500">
                                <option value="feriado">Feriado</option>
                                <option value="ferias">Férias</option>
                            </select>
                            <input type="text" id="holiday-name" placeholder="Nome (Ex: Férias de Julho)" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm font-semibold">
                        </div>
                        
                        <div class="flex items-center gap-2 mt-1">
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Data Inicial</label>
                                <input type="date" id="holiday-start" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <span class="text-xs font-bold text-slate-400 mt-4">até</span>
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Data Final (Opcional)</label>
                                <input type="date" id="holiday-end" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                        </div>
                        <button onclick="addHoliday()" class="w-full mt-1 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-700 transition-colors">Adicionar Data/Período</button>
                    </div>
                    <div id="holidays-list" class="flex flex-col gap-1.5 max-h-40 overflow-y-auto calendar-scroll pr-1"></div>
                </div>

                <!-- Unidades Curriculares -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-lg flex items-center gap-2">
                            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                            Unidades Curriculares
                        </h2>
                        <span class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100" id="total-hours-display">0h Alocadas</span>
                    </div>
                    
                    <div id="uc-form-container" class="space-y-3 p-4 bg-slate-50 border border-slate-200 rounded-lg shadow-sm transition-colors">
                        <input type="text" id="uc-name" placeholder="Nome da Matéria (UC)" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-semibold">
                        
                        <div class="grid grid-cols-3 gap-3">
                            <div class="col-span-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total (h)</label>
                                <input type="number" id="uc-total-hours" placeholder="40" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <div class="col-span-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Diária (h)</label>
                                <input type="number" id="uc-daily-hours" placeholder="4" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <div class="col-span-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Turno</label>
                                <select id="uc-shift" class="w-full border border-slate-300 rounded-lg p-2 text-sm text-slate-700 bg-white">
                                    <option value="Manhã">Manhã</option>
                                    <option value="Tarde">Tarde</option>
                                    <option value="Integral">Integral</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="phases-wrapper" class="bg-white border border-slate-200 rounded-lg p-2 space-y-2 shadow-inner">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Dias de Aula e Início</label>
                                <button type="button" onclick="addPhaseUI()" class="text-[9px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold hover:bg-blue-100 uppercase tracking-wider transition-colors">+ Adicionar Fase</button>
                            </div>
                            <div id="phases-list" class="space-y-3">
                                <!-- Preenchido pelo Javascript -->
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-4 gap-3">
                            <div class="col-span-3">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Instrutor</label>
                                <select id="uc-prof-select" class="w-full border border-slate-300 rounded-lg p-2 text-sm text-slate-700 bg-white"></select>
                            </div>
                            <div class="col-span-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Cor</label>
                                <input type="color" id="uc-color" class="w-full h-[38px] border border-slate-300 rounded-lg cursor-pointer p-0.5" title="Escolha a cor desta UC">
                            </div>
                        </div>
                        
                        <!-- NOVIDADE: IGNORAR FÉRIAS -->
                        <div class="border-t border-slate-200 pt-2 mt-1">
                            <label class="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer select-none">
                                <input type="checkbox" id="uc-ignore-ferias" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Ignorar Férias (Prática Profissional)</span>
                            </label>
                        </div>
                        
                        <div class="flex gap-2 mt-2">
                            <button id="btn-save-uc" onclick="saveUC()" class="flex-1 bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-emerald-700 transition-colors shadow-sm">Adicionar UC</button>
                            <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden bg-slate-400 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-slate-500 transition-colors shadow-sm">Cancelar</button>
                        </div>
                    </div>

                    <div id="ucs-list" class="space-y-3 mt-4 pr-1"></div>
                </div>
            </div>

            <!-- PAINEL PRINCIPAL -->
            <div class="w-full lg:w-2/3 flex flex-col gap-6 overflow-y-auto calendar-scroll pr-2 pb-4">
                
                <!-- Calendário -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col shrink-0">
                    <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-bold text-lg text-slate-800">Calendário de Execução</h2>
                        <div class="flex gap-2" id="year-buttons"></div>
                    </div>
                    <div class="p-6 overflow-y-auto h-[600px] calendar-scroll relative" id="calendar-container">
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8" id="calendar-grid"></div>
                    </div>
                </div>

                <!-- Resumo por Professor -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 shrink-0">
                    <div class="p-4 border-b border-slate-100 bg-slate-50">
                        <h2 class="font-bold text-lg text-slate-800">Alocação por Instrutor</h2>
                    </div>
                    <div class="p-6">
                        <div id="instructor-summary" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= ESTADO GLOBAL =================
        let maxMorning = 4;
        let maxAfternoon = 4;
        let instructors = []; 
        let editingUcId = null; 
        
        // Feriados base
        const defaultHolidaysArr = [
            ['2025-01-01', 'Ano Novo'], ['2025-03-03', 'Carnaval'], ['2025-03-04', 'Carnaval'], ['2025-04-18', 'Paixão de Cristo'], ['2025-04-21', 'Tiradentes'], ['2025-05-01', 'Dia do Trabalho'], ['2025-06-19', 'Corpus Christi'], ['2025-08-05', 'Aniversário de Rio Verde'], ['2025-09-07', 'Independência do Brasil'], ['2025-10-12', 'Nossa Sra. Aparecida'], ['2025-11-02', 'Finados'], ['2025-11-15', 'Proclamação da República'], ['2025-11-20', 'Consciência Negra'], ['2025-12-25', 'Natal'],
            ['2026-01-01', 'Ano Novo'], ['2026-02-16', 'Carnaval'], ['2026-02-17', 'Carnaval'], ['2026-04-03', 'Paixão de Cristo'], ['2026-04-21', 'Tiradentes'], ['2026-05-01', 'Dia do Trabalho'], ['2026-06-04', 'Corpus Christi'], ['2026-08-05', 'Aniversário de Rio Verde'], ['2026-09-07', 'Independência do Brasil'], ['2026-10-12', 'Nossa Sra. Aparecida'], ['2026-11-02', 'Finados'], ['2026-11-15', 'Proclamação da República'], ['2026-11-20', 'Consciência Negra'], ['2026-12-25', 'Natal'],
            ['2027-01-01', 'Ano Novo'], ['2027-02-08', 'Carnaval'], ['2027-02-09', 'Carnaval'], ['2027-03-26', 'Paixão de Cristo'], ['2027-04-21', 'Tiradentes'], ['2027-05-01', 'Dia do Trabalho'], ['2027-05-27', 'Corpus Christi'], ['2027-08-05', 'Aniversário de Rio Verde'], ['2027-09-07', 'Independência do Brasil'], ['2027-10-12', 'Nossa Sra. Aparecida'], ['2027-11-02', 'Finados'], ['2027-11-15', 'Proclamação da República'], ['2027-11-20', 'Consciência Negra'], ['2027-12-25', 'Natal'],
            ['2028-01-01', 'Ano Novo'], ['2028-02-28', 'Carnaval'], ['2028-02-29', 'Carnaval'], ['2028-04-14', 'Paixão de Cristo'], ['2028-04-21', 'Tiradentes'], ['2028-05-01', 'Dia do Trabalho'], ['2028-06-15', 'Corpus Christi'], ['2028-08-05', 'Aniversário de Rio Verde'], ['2028-09-07', 'Independência do Brasil'], ['2028-10-12', 'Nossa Sra. Aparecida'], ['2028-11-02', 'Finados'], ['2028-11-15', 'Proclamação da República'], ['2028-11-20', 'Consciência Negra'], ['2028-12-25', 'Natal']
        ];
        
        let holidays = new Map();
        defaultHolidaysArr.forEach(([d, n]) => holidays.set(d, { name: n, type: 'feriado' }));
        
        let ucs = [];
        let schedule = {}; 

        // ================= FUNÇÕES DE COR E DATA =================
        function generateColor() {
            const r = Math.floor(Math.random() * 100 + 155).toString(16).padStart(2, '0');
            const g = Math.floor(Math.random() * 100 + 155).toString(16).padStart(2, '0');
            const b = Math.floor(Math.random() * 100 + 155).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const colorInput = document.getElementById('uc-color');
            if(colorInput) colorInput.value = generateColor();
        });

        function formatDateBR(dateStr) { 
            if(!dateStr) return '--/--/----'; 
            const parts = dateStr.split('-'); 
            if(parts.length !== 3) return dateStr;
            return `${parts[2]}/${parts[1]}/${parts[0]}`; 
        }

        function toDateString(dateObj) { 
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`; 
        }

        // ================= FASES DA UC (UI) =================
        function addPhaseUI(startDate = '', days = [1,2,3,4,5], isFirst = false) {
            const container = document.getElementById('phases-list'); 
            if (container.children.length === 0) isFirst = true;

            const div = document.createElement('div'); 
            div.className = `phase-row p-2 rounded border relative ${isFirst ? 'bg-slate-50 border-slate-200' : 'bg-blue-50/30 border-blue-200 mt-2'}`;
            
            const labelStr = isFirst ? 'Início da Matéria' : 'Mudar a partir de';
            const removeBtn = isFirst ? '' : `<button type="button" onclick="this.parentElement.remove()" class="absolute top-1 right-2 text-xl font-bold text-slate-400 hover:text-red-500" title="Remover Fase">&times;</button>`;
            
            const daysMap = {1:'SEG', 2:'TER', 3:'QUA', 4:'QUI', 5:'SEX', 6:'SÁB', 0:'DOM'};
            let daysHtml = [1,2,3,4,5,6,0].map(d => {
                const checked = days.includes(d) ? 'checked' : '';
                return `
                <label class="flex-1 text-center">
                    <input type="checkbox" value="${d}" ${checked} class="peer hidden">
                    <div class="py-1 border border-slate-200 rounded text-[9px] font-bold text-slate-400 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 cursor-pointer transition-all">
                        ${daysMap[d]}
                    </div>
                </label>`;
            }).join('');

            div.innerHTML = `
                ${removeBtn}
                <div class="mb-2 pr-6">
                    <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">${labelStr}</label>
                    <input type="date" class="phase-date w-full border border-slate-300 rounded p-1.5 text-xs focus:ring-blue-500 focus:border-blue-500" value="${startDate}">
                </div>
                <div class="flex gap-0.5 phase-days">${daysHtml}</div>
            `;
            container.appendChild(div);
        }

        function getPhasesFromUI() {
            const rows = document.querySelectorAll('.phase-row');
            let phases = [];
            let isValid = true;
            
            rows.forEach(r => {
                const date = r.querySelector('.phase-date').value;
                const checkboxes = r.querySelectorAll('input[type="checkbox"]:checked');
                const days = Array.from(checkboxes).map(cb => parseInt(cb.value));
                
                if (!date || days.length === 0) isValid = false;
                phases.push({ startDate: date, daysOfWeek: days });
            });
            
            return isValid ? phases : null;
        }

        function resetPhasesUI() { 
            const container = document.getElementById('phases-list');

        // ================= IMPORTAR E EXPORTAR EXCEL =================
        function newDocument() {
            if(confirm("Deseja criar um cronograma em branco? Seus dados não salvos serão perdidos.")) {
                window.location.reload(); 
            }
        }

        function exportExcel() {
            try {
                const wb = XLSX.utils.book_new();
                
                // Sheet: Configurações
                const configData = [{ 
                    NomeCurso: document.getElementById('course-name').value, 
                    CargaTotalPrevista: document.getElementById('course-target-hours').value, 
                    MaxManha: maxMorning, 
                    MaxTarde: maxAfternoon 
                }];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(configData), "Configurações");
                
                // Sheet: Instrutores
                const instData = instructors.map(i => ({ Nome: i }));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(instData), "Instrutores");
                
                // Sheet: Feriados (Salva o tipo também)
                const holData = Array.from(holidays.entries()).map(([data, obj]) => ({ 
                    Data: data, 
                    Nome: obj.name,
                    Tipo: obj.type
                }));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(holData), "Feriados");
                
                // Sheet: UCs
                const exportUcs = ucs.map(u => {
                    const phasesStr = u.phases.map(p => `${p.startDate}:${p.daysOfWeek.join(',')}`).join('|');
                    return { 
                        ID: u.id, 
                        Nome: u.name, 
                        CargaTotal: u.totalHours, 
                        CargaDiaria: u.dailyHours, 
                        Turno: u.shift, 
                        Professor: u.prof, 
                        Cor: u.color,
                        IgnorarFerias: u.ignoreFerias ? 'Sim' : 'Não',
                        Fases: phasesStr 
                    };
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportUcs), "UnidadesCurriculares");
                
                XLSX.writeFile(wb, "cronograma_curso.xlsx");
            } catch(e) {
                alert("Erro ao exportar o Excel. Verifique se há dados válidos inseridos.");
                console.error(e);
            }
        }

        function importExcel(event) {
            const file = event.target.files[0]; 
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    
                    // Lendo Configurações
                    if (wb.Sheets["Configurações"]) { 
                        const c = XLSX.utils.sheet_to_json(wb.Sheets["Configurações"])[0]; 
                        if (c) { 
                            document.getElementById('course-name').value = c.NomeCurso || ''; 
                            document.getElementById('course-target-hours').value = c.CargaTotalPrevista || ''; 
                            document.getElementById('max-morning').value = c.MaxManha || 4; 
                            document.getElementById('max-afternoon').value = c.MaxTarde || 4; 
                            maxMorning = parseInt(c.MaxManha) || 4; 
                            maxAfternoon = parseInt(c.MaxTarde) || 4; 
                        } 
                    }
                    
                    // Lendo Instrutores
                    if (wb.Sheets["Instrutores"]) {
                        instructors = XLSX.utils.sheet_to_json(wb.Sheets["Instrutores"]).map(i => i.Nome).filter(Boolean); 
                    } else {
                        instructors = [];
                    }
                    
                    // Lendo Feriados
                    if (wb.Sheets["Feriados"]) { 
                        holidays.clear(); 
                        XLSX.utils.sheet_to_json(wb.Sheets["Feriados"]).forEach(h => { 
                            if(h.Data) holidays.set(h.Data, { name: h.Nome || 'Feriado', type: h.Tipo || 'feriado' }); 
                        }); 
                    }
                    
                    // Lendo UCs
                    if (wb.Sheets["UnidadesCurriculares"]) {
                        ucs = XLSX.utils.sheet_to_json(wb.Sheets["UnidadesCurriculares"]).map(u => {
                            let phases = [];
                            if (u.Fases) {
                                phases = u.Fases.split('|').map(f => {
                                    let parts = f.split(':');
                                    return { startDate: parts[0], daysOfWeek: parts[1].split(',').map(Number) };
                                });
                            } else {
                                phases = [{ 
                                    startDate: u.DataInicio, 
                                    daysOfWeek: u.DiasSemana ? String(u.DiasSemana).split(',').map(Number) : [1,2,3,4,5] 
                                }];
                            }
                            
                            let importedColor = u.Cor;
                            if (!importedColor || !importedColor.includes('#')) {
                                importedColor = generateColor();
                            }

                            return { 
                                id: u.ID ? String(u.ID) : Date.now().toString() + Math.random(), 
                                name: u.Nome, 
                                startDate: phases[0].startDate, 
                                totalHours: parseInt(u.CargaTotal), 
                                dailyHours: parseInt(u.CargaDiaria), 
                                shift: u.Turno, 
                                prof: u.Professor, 
                                color: importedColor,
                                ignoreFerias: u.IgnorarFerias === 'Sim',
                                phases: phases, 
                                calculatedStart: null, 
                                calculatedEnd: null 
                            };
                        });
                    }
                    
                    cancelEdit(); 
                    renderInstructors(); 
                    renderHolidays(); 
                    calculateSchedule(); 
                    alert("Cronograma importado com sucesso!");
                } catch (error) { 
                    alert("Erro ao ler o arquivo Excel. Verifique se o formato é válido."); 
                    console.error(error);
                }
                
                document.getElementById('file-upload').value = '';
            }; 
            reader.readAsArrayBuffer(file);
        }

            if (val && !instructors.includes(val)) { 
                instructors.push(val); 
                document.getElementById('instructor-name').value = '';

            } 
        }

        // ================= FÉRIAS E FERIADOS =================
        function addHoliday() { 
            const typeVal = document.getElementById('holiday-type').value;
            const startVal = document.getElementById('holiday-start').value;
            const endVal = document.getElementById('holiday-end').value; 
            const nameVal = document.getElementById('holiday-name').value.trim() || (typeVal === 'feriado' ? 'Feriado' : 'Férias'); 
            
            if (!startVal) { alert("Informe a data inicial."); return; }
            
            const startD = new Date(startVal + 'T00:00:00');
            const endD = endVal ? new Date(endVal + 'T00:00:00') : new Date(startVal + 'T00:00:00');
            
            if (endD < startD) { alert("Data final inválida."); return; }
            
            let curr = new Date(startD); 
            while (curr <= endD) { 
                holidays.set(toDateString(curr), { name: nameVal, type: typeVal }); 
                curr.setDate(curr.getDate() + 1); 
            }
            
            document.getElementById('holiday-start').value = ''; 
            document.getElementById('holiday-end').value = ''; 
            document.getElementById('holiday-name').value = ''; 
            
            renderHolidays(); 
            calculateSchedule(); 
        }
        
        function removeHolidayRange(startStr, endStr) {
            let curr = new Date(startStr + 'T00:00:00');
            let endD = new Date(endStr + 'T00:00:00');
            
            while (curr <= endD) { 
                holidays.delete(toDateString(curr)); 
                curr.setDate(curr.getDate() + 1); 
            }
            
            renderHolidays(); 
            calculateSchedule();
        }
        
        function renderHolidays() {
            const container = document.getElementById('holidays-list'); 
            container.innerHTML = '';
            
            const sorted = Array.from(holidays.entries()).sort((a, b) => a[0].localeCompare(b[0]));
            if (sorted.length === 0) return;
            
            const groups = []; 
            let current = { start: sorted[0][0], end: sorted[0][0], name: sorted[0][1].name, type: sorted[0][1].type };
            
            for(let i = 1; i < sorted.length; i++) {
                const [dateStr, obj] = sorted[i];
                const prevDate = new Date(current.end + 'T00:00:00');
                const currDate = new Date(dateStr + 'T00:00:00');
                
                // Agrupa se for o dia seguinte E tiver o mesmo nome/tipo
                if (Math.ceil(Math.abs(currDate - prevDate) / 86400000) === 1 && obj.name === current.name && obj.type === current.type) {
                    current.end = dateStr;
                } else { 
                    groups.push(current); 
                    current = { start: dateStr, end: dateStr, name: obj.name, type: obj.type }; 
                }
            }
            groups.push(current);
            
            groups.forEach(g => {
                let d = formatDateBR(g.start); 
                if (g.start !== g.end) d += ` até ${formatDateBR(g.end)}`;
                
                const badgeColor = g.type === 'feriado' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-amber-100 text-amber-700 border-amber-200';
                const tag = g.type === 'feriado' ? 'FERIADO' : 'FÉRIAS';
                
                container.innerHTML += `
                <div class="flex justify-between items-center ${badgeColor} border px-3 py-1.5 rounded-md text-xs font-semibold shadow-sm">
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] px-1.5 py-0.5 rounded bg-white/50">${tag}</span>
                        <span>${d} - <span class="font-normal">${g.name}</span></span>
                    </div>
                    <button onclick="removeHolidayRange('${g.start}', '${g.end}')" class="ml-2 hover:opacity-60 focus:outline-none text-lg leading-none">&times;</button>
                </div>`;
            });
        }

        // ================= UNIDADES CURRICULARES (UCS) =================
        function saveUC() {
            const name = document.getElementById('uc-name').value.trim();
            const totalHours = parseInt(document.getElementById('uc-total-hours').value); 
            const dailyHours = parseInt(document.getElementById('uc-daily-hours').value); 
            const shift = document.getElementById('uc-shift').value; 
            const prof = document.getElementById('uc-prof-select').value; 
            const color = document.getElementById('uc-color').value;
            const ignoreFerias = document.getElementById('uc-ignore-ferias').checked;
            
            const phases = getPhasesFromUI();
            
            if (!phases) { 
                alert("Preencha todas as datas de início e marque os dias da semana em todas as fases configuradas."); 
                return; 
            }
            if (!name || isNaN(totalHours) || totalHours <= 0 || isNaN(dailyHours) || dailyHours <= 0 || !prof) { 
                alert("Preencha todos os campos obrigatórios e garanta que existe pelo menos um instrutor criado."); 
                return; 
            }

            if (editingUcId) {
                const i = ucs.findIndex(u => u.id === editingUcId); 
                if (i !== -1) {
                    Object.assign(ucs[i], {
                        name, 
                        startDate: phases[0].startDate, 
                        totalHours, 
                        dailyHours, 
                        shift, 
                        prof, 
                        color, 
                        ignoreFerias,
                        phases
                    });
                }
                cancelEdit(); 
            } else {
                ucs.push({ 
                    id: Date.now().toString(), 
                    name, 
                    startDate: phases[0].startDate, 
                    totalHours, 
                    dailyHours, 
                    shift, 
                    prof, 
                    color, 
                    ignoreFerias,
                    phases, 
                    calculatedStart: null, 
                    calculatedEnd: null 
                });
                
                document.getElementById('uc-name').value = ''; 
                document.getElementById('uc-total-hours').value = ''; 
                document.getElementById('uc-color').value = generateColor(); 
                document.getElementById('uc-ignore-ferias').checked = false;
                resetPhasesUI(); 
            } 
            
            calculateSchedule();
        }

        // ================= MOTOR DO CALENDÁRIO =================
        function calculateSchedule() {
            schedule = {}; 
            let totalHoursCounter = 0; 
            
            // Ordena as matérias pela data de início real da primeira fase
            ucs.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
            
            ucs.forEach(uc => {
                uc.calculatedStart = null; 
                uc.calculatedEnd = null; 
                totalHoursCounter += uc.totalHours; 
                let hoursToAllocate = uc.totalHours; 
                
                const sortedPhases = [...(uc.phases || [])].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
                if(sortedPhases.length === 0) {
                    sortedPhases.push({ startDate: uc.startDate, daysOfWeek: [1,2,3,4,5] });
                }
                
                let [sYear, sMonth, sDay] = sortedPhases[0].startDate.split('-');
                let currentDate = new Date(sYear, sMonth - 1, sDay);

                while (hoursToAllocate > 0) {
                    const dateStr = toDateString(currentDate);
                    const dayOfWeek = currentDate.getDay(); 
                    
                    // Descobre a fase ativa para o dia atual no loop
                    let activePhase = sortedPhases[0]; 
                    for(let p of sortedPhases) {
                        if (currentDate >= new Date(p.startDate + 'T00:00:00')) {
                            activePhase = p;
                        }
                    }
                    
                    // Regras de Bloqueio (Pular dia)
                    let shouldSkip = false;
                    
                    // 1. Dia não pertence aos dias da semana configurados na fase
                    if (!activePhase.daysOfWeek.includes(dayOfWeek)) {
                        shouldSkip = true;
                    } 
                    // 2. Dia tem feriado ou férias
                    else if (holidays.has(dateStr)) {
                        const hData = holidays.get(dateStr);
                        if (hData.type === 'feriado') {
                            shouldSkip = true; // Feriado NINGUÉM trabalha
                        } else if (hData.type === 'ferias') {
                            if (!uc.ignoreFerias) {
                                shouldSkip = true; // Férias normais pausam a UC
                            }
                            // Se uc.ignoreFerias for true, shouldSkip continua false, a aula acontece.
                        }
                    }
                    
                    if (shouldSkip) { 
                        currentDate.setDate(currentDate.getDate() + 1); 
                        continue; 
                    }
                    
                    if (!schedule[dateStr]) schedule[dateStr] = { manha: 0, tarde: 0, ucs: [] }; 
                    let allocatedHere = 0;
                    
                    if (uc.shift === 'Manhã') { 
                        let c = Math.min(uc.dailyHours, maxMorning - schedule[dateStr].manha, hoursToAllocate); 
                        if (c > 0) { schedule[dateStr].manha += c; allocatedHere = c; } 
                    } 
                    else if (uc.shift === 'Tarde') { 
                        let c = Math.min(uc.dailyHours, maxAfternoon - schedule[dateStr].tarde, hoursToAllocate); 
                        if (c > 0) { schedule[dateStr].tarde += c; allocatedHere = c; } 
                    } 
                    else if (uc.shift === 'Integral') {
                        let aM = maxMorning - schedule[dateStr].manha;
                        let aT = maxAfternoon - schedule[dateStr].tarde;
                        let c = Math.min(uc.dailyHours, aM + aT, hoursToAllocate);
                        
                        if (c > 0) { 
                            let tM = Math.min(c, aM);
                            let tT = c - tM; 
                            schedule[dateStr].manha += tM; 
                            schedule[dateStr].tarde += tT; 
                            allocatedHere = c; 
                        }
                    }

                    if (allocatedHere > 0) { 
                        schedule[dateStr].ucs.push({ id: uc.id, name: uc.name, hours: allocatedHere, color: uc.color, shift: uc.shift }); 
                        hoursToAllocate -= allocatedHere; 
                        
                        if (!uc.calculatedStart) uc.calculatedStart = dateStr; 
                        uc.calculatedEnd = dateStr; 
                    }
                    
                    currentDate.setDate(currentDate.getDate() + 1);
                }
            });
            
            document.getElementById('total-hours-display').innerText = `${totalHoursCounter}h Alocadas`; 
            renderUCs(); 
            renderCalendar(); 
            renderInstructorSummary();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-grid'); 
            const btnContainer = document.getElementById('year-buttons'); 
            container.innerHTML = ''; 
            btnContainer.innerHTML = '';
            
            if (ucs.length === 0) { 
                container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center text-slate-400 py-24">
                    <svg class="w-16 h-16 mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p class="text-lg font-semibold text-slate-500">Nenhum mês gerado</p>
                </div>`; 
                return; 
            }
            
            let minD = null, maxD = null; 
            ucs.forEach(uc => { 
                if (uc.calculatedStart) { 
                    const d = new Date(uc.calculatedStart.split('-')[0], uc.calculatedStart.split('-')[1]-1, uc.calculatedStart.split('-')[2]); 
                    if(!minD || d < minD) minD = d; 
                } 
                if (uc.calculatedEnd) { 
                    const d = new Date(uc.calculatedEnd.split('-')[0], uc.calculatedEnd.split('-')[1]-1, uc.calculatedEnd.split('-')[2]); 
                    if(!maxD || d > maxD) maxD = d; 
                } 
            });
            
            if (!minD || !maxD) { 
                container.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-bold">Aumente a capacidade diária. Sem carga horária gerada.</div>'; 
                return; 
            }
            
            let cY = minD.getFullYear(), cM = minD.getMonth(), eY = maxD.getFullYear(), eM = maxD.getMonth();
            let monthsToRender = [];
            
            while (cY < eY || (cY === eY && cM <= eM)) { 
                monthsToRender.push({ y: cY, m: cM }); 
                cM++; 
                if (cM > 11) { cM = 0; cY++; } 
            }
            
            const uniqueYears = [...new Set(monthsToRender.map(m => m.y))];
            uniqueYears.forEach(y => {
                btnContainer.innerHTML += `<button onclick="scrollToYear(${y})" class="px-3 py-1 bg-white border border-slate-300 rounded shadow-sm text-sm font-semibold hover:bg-slate-100">${y}</button>`;
            });

            const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

            monthsToRender.forEach(({y, m}) => {
                const div = document.createElement('div'); 
                div.className = 'bg-white border border-slate-200 rounded-xl p-4 shadow-sm'; 
                div.id = `month-${y}-${m}`;
                div.innerHTML = `<h3 class="font-bold text-slate-800 text-center mb-3">${monthNames[m]} ${y}</h3>`;
                
                const grid = document.createElement('div'); 
                grid.className = 'month-grid';
                ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => grid.innerHTML += `<div class="day-header">${d}</div>`);
                
                // Espaços vazios no início do mês
                for (let i = 0; i < new Date(y, m, 1).getDay(); i++) {
                    grid.appendChild(document.createElement('div'));
                }
                
                // Dias do mês
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) {
                    const ds = toDateString(new Date(y, m, day));
                    const dw = new Date(y, m, day).getDay();
                    
                    const cell = document.createElement('div'); 
                    cell.className = 'day-cell'; 
                    cell.innerHTML = `<span class="day-number">${day}</span>`;
                    
                    if (dw === 0 || dw === 6) cell.classList.add('weekend');
                    
                    if (holidays.has(ds)) { 
                        const hData = holidays.get(ds);
                        if(hData.type === 'ferias') {
                            cell.classList.add('ferias');
                            cell.title = `Férias: ${hData.name}`;
                        } else {
                            cell.classList.add('holiday'); 
                            cell.title = `Feriado: ${hData.name}`; 
                        }
                    }
                    
                    if (schedule[ds] && schedule[ds].ucs.length > 0) {
                        cell.classList.add('has-class'); 
                        const al = schedule[ds].ucs;
                        
                        if (al.length === 1) { 
                            cell.style.backgroundColor = al[0].color; 
                            cell.title = `${al[0].name} (${al[0].hours}h) - ${al[0].shift}`; 
                        } else {
                            al.sort((a, b) => ({'Manhã':1, 'Integral':2, 'Tarde':3}[a.shift] - {'Manhã':1, 'Integral':2, 'Tarde':3}[b.shift]));
                            let st = [], pt = 0; 
                            const tot = al.reduce((s, u) => s + u.hours, 0);
                            
                            al.forEach(a => { 
                                const p = (a.hours / tot) * 100; 
                                st.push(`${a.color} ${pt}%`); 
                                pt += p; 
                                st.push(`${a.color} ${pt}%`); 
                            });
                            
                            cell.style.background = `linear-gradient(135deg, ${st.join(', ')})`; 
                            cell.title = al.map(a => `${a.name} (${a.hours}h - ${a.shift})`).join(' | ');
                        }
                    } 
                    grid.appendChild(cell);
                } 
                div.appendChild(grid); 
                container.appendChild(div);
            });
        }

        function renderInstructorSummary() {
            const container = document.getElementById('instructor-summary'); 
            container.innerHTML = '';
            
            if (instructors.length === 0) { 
                container.innerHTML = '<p class="text-sm text-slate-400 italic">Nenhum instrutor cadastrado.</p>'; 
                return; 
            }
            
            instructors.forEach(prof => {
                const pU = ucs.filter(u => u.prof === prof);
                
                let listHtml = '';
                if(pU.length === 0) {
                    listHtml = '<div class="p-4 text-sm text-slate-400 italic bg-slate-50">Sem UCs atribuídas.</div>';
                } else {
                    listHtml = '<ul class="divide-y divide-slate-100">' + pU.map(uc => `
                        <li class="p-3 hover:bg-slate-50 transition-colors">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold text-sm text-slate-800 flex items-center gap-2">
                                    <div class="w-2.5 h-2.5 rounded-full" style="background-color: ${uc.color}"></div>
                                    ${uc.name}
                                </span>
                                <span class="text-xs font-semibold bg-slate-100 px-2 py-0.5 rounded text-slate-500">${uc.totalHours}h</span>
                            </div>
                            <div class="pl-4 text-xs text-slate-500 flex justify-between">
                                <span>${uc.calculatedStart ? `${formatDateBR(uc.calculatedStart)} a${formatDateBR(uc.calculatedEnd)}` : '<span class="text-red-500">Erro de Agendamento</span>'}</span>
                                <span class="uppercase tracking-wider font-semibold">${uc.shift}</span>
                            </div>
                        </li>`).join('') + '</ul>';
                }
                
                container.innerHTML += `
                <div class="border border-slate-200 rounded-lg overflow-hidden">
                    <div class="bg-purple-50 text-purple-800 font-bold px-4 py-2 border-b border-purple-100 flex justify-between items-center">
                        ${prof}
                        <span class="bg-purple-200 text-purple-800 text-[10px] px-2 py-0.5 rounded-full">${pU.length} UCs</span>
                    </div>
                    ${listHtml}
                </div>`;
            });
        }

        function scrollToYear(year) { 
            for(let m = 0; m < 12; m++) { 
                const target = document.getElementById(`month-${year}-${m}`); 
                if(target) { 
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' }); 
                    return; 
                } 
            } 
        }

        // ================= INICIALIZAÇÃO =================
        document.getElementById('max-morning').addEventListener('change', (e) => { maxMorning = parseInt(e.target.value) || 0; calculateSchedule(); });
        document.getElementById('max-afternoon').addEventListener('change', (e) => { maxAfternoon = parseInt(e.target.value) || 0; calculateSchedule(); });

        resetPhasesUI(); 
        renderInstructors(); 
        renderHolidays(); 
        calculateSchedule();

    </script>
</body>
</html>
